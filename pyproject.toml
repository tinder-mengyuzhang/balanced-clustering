[tool.poetry]
name = "balanced-clustering"
version = "0.1.0"
description = "Clustering metrics for imbalanced datasets"
authors = ["Hassaan Maan <hurmaan99@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.10"
numpy = "^2.2.5"
scipy = "^1.15.3"
scikit-learn = "^1.6.1"
pandas = "^2.2.3"
Cython = "^3.1.0"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
flake8 = "^7.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
